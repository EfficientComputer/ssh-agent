on: [ push, pull_request ]

jobs:
    unit_tests:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-node@v7
                with:
                    node-version: 24
            -   run: npm test

    deployment_keys_demo:
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, macOS-latest, windows-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@v6
            -   name: Setup key
                uses: ./
                with:
                    ssh-private-key: |
                        ${{ secrets.MPDUDE_TEST_1_DEPLOY_KEY }}
                        ${{ secrets.MPDUDE_TEST_2_DEPLOY_KEY }}
            -   run: |
                    git clone https://github.com/mpdude/test-1.git test-1-http
                    git clone git@github.com:mpdude/test-1.git test-1-git
                    git clone ssh://git@github.com/mpdude/test-1.git test-1-git-ssh
                    git clone https://github.com/mpdude/test-2.git test-2-http
                    git clone git@github.com:mpdude/test-2.git test-2-git
                    git clone ssh://git@github.com/mpdude/test-2.git test-2-git-ssh

    docker_demo:
        runs-on: ubuntu-latest
        container:
            image: ubuntu:latest
        steps:
            -   uses: actions/checkout@v6
            -   run: apt update && apt install -y openssh-client git
            -   name: Setup key
                uses: ./
                with:
                    ssh-private-key: |
                        ${{ secrets.MPDUDE_TEST_1_DEPLOY_KEY }}
                        ${{ secrets.MPDUDE_TEST_2_DEPLOY_KEY }}
            -   run: |
                    git clone https://github.com/mpdude/test-1.git test-1-http
                    git clone git@github.com:mpdude/test-1.git test-1-git
                    git clone ssh://git@github.com/mpdude/test-1.git test-1-git-ssh
                    git clone https://github.com/mpdude/test-2.git test-2-http
                    git clone git@github.com:mpdude/test-2.git test-2-git
                    git clone ssh://git@github.com/mpdude/test-2.git test-2-git-ssh

    other_host_demo:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
            -   name: Generate a key for a repository on another host
                id: key
                run: |
                    ssh-keygen -q -t ed25519 -N '' -C 'ssh://git@git.example.com:2222/group/sub/repo.git' -f "$RUNNER_TEMP/key"
                    { echo 'private-key<<EOF'; cat "$RUNNER_TEMP/key"; echo EOF; } >> "$GITHUB_OUTPUT"
            -   name: Setup key
                uses: ./
                with:
                    ssh-private-key: ${{ steps.key.outputs.private-key }}
            -   name: Check the git and ssh config
                run: |
                    git config --global --get-regexp '^url\.git@key-[0-9a-f]{64}\.git\.example\.com:group/sub/repo\.insteadof$' > rewrites
                    cat rewrites
                    grep -F ' https://git.example.com/group/sub/repo' rewrites
                    grep -F ' git@git.example.com:group/sub/repo' rewrites
                    grep -F ' ssh://git@git.example.com/group/sub/repo' rewrites
                    grep -F ' ssh://git@git.example.com:2222/group/sub/repo' rewrites
                    grep -E '^ +HostName git\.example\.com$' ~/.ssh/config
                    grep -E '^ +Port 2222$' ~/.ssh/config
